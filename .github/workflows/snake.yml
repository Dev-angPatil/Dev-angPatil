name: Generate Snake Animation

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates a snake game from the user's contributions graph, outputs a svg animation
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#0c081e,#ff007f,#ffaa00,#00f2fe,#ffffff

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/github-contribution-grid-snake.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update contribution snake animation [skip ci]" && git push origin main)
