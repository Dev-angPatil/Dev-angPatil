<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      
      .btn-bg {
        fill: #0c0822;
        stroke: #ff007f;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.8));
        transition: all 0.3s ease;
      }
      .btn-bg-inner {
        fill: none;
        stroke: #00f2fe;
        stroke-width: 1;
        opacity: 0.7;
      }
      .btn-text {
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        font-weight: bold;
        fill: #00f2fe;
        text-anchor: middle;
        filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.8));
      }
      .btn-triangle {
        fill: #00f2fe;
        filter: drop-shadow(0 0 3px rgba(0, 242, 254, 0.8));
      }
    </style>
  </defs>

  <!-- Main Button Container -->
  <rect x="5" y="5" width="240" height="50" rx="8" class="btn-bg" />
  <rect x="9" y="9" width="232" height="42" rx="6" class="btn-bg-inner" />

  <!-- Play icon triangle -->
  <polygon points="40,25 40,35 50,30" class="btn-triangle" />

  <!-- Label -->
  <text x="140" y="34" class="btn-text">PLAY NEON TETRIS</text>
</svg>
